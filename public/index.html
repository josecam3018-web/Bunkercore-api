<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunkerCore Console</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #58a6ff; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
        button { background: #238636; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        input { width: 100%; padding: 8px; margin: 8px 0 15px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ BunkerCore Zero-Trust API</h2>
        <p>Servidor activo en Render con cifrado AES-256-GCM.</p>
        <button onclick="genKey()">Generar API Key & Tenant</button>
        <div id="res" style="margin-top:15px;"></div>
    </div>
    <script>
        function genKey() {
            const tenant = 'tenant-' + Math.random().toString(36).substring(2, 8);
            const key = 'bk_live_' + Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('res').innerHTML = '<b>Tenant:</b> ' + tenant + '<br><b>API Key:</b> ' + key;
        }
    </script>
</body>
</html>
