<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunkerCore - Verificación por Huella</title>
  <script src="https://unpkg.com/@simplewebauthn/browser@9.0.0/dist/bundle/index.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 350px; }
    button { background: #3b82f6; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2563eb; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔑 BunkerCore Auth</h2>
    <p>Verifica tu identidad usando el lector de huella dactilar de tu dispositivo.</p>
    <button id="btnFingerprint">🖐️ Escanear Huella</button>
    <div id="status" class="status">Listo para escanear</div>
  </div>

  <script>
    const btn = document.getElementById('btnFingerprint');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      try {
        status.textContent = 'Solicitando desafío...';
        
        // 1. Pedir opciones de autenticación al backend
        const resOptions = await fetch('/v1/auth/webauthn-options');
        const options = await resOptions.json();

        status.textContent = '👆 Toca el sensor de huella...';

        // 2. Activar el sensor de huella del dispositivo vía WebAuthn
        const authResponse = await SimpleWebAuthnBrowser.startAuthentication(options);

        status.textContent = 'Verificando con el servidor...';

        // 3. Enviar la respuesta del sensor al servidor
        const resVerify = await fetch('/v1/auth/webauthn-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(authResponse)
        });

        const result = await resVerify.json();

        if (result.status === 'VERIFIED') {
          status.style.color = '#4ade80';
          status.textContent = '✅ ¡Huella verificada correctamente!';
        } else {
          status.style.color = '#f87171';
          status.textContent = '❌ Verificación fallida.';
        }
      } catch (err) {
        status.style.color = '#f87171';
        status.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
